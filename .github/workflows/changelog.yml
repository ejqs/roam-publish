name: Changelog

# A pull request into main that changes the extension must add to CHANGELOG.md, which roam.pub/updates shows. Label
# it `no-changelog` when nothing in it is something the extension's users would notice.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          if ! grep -qE '^src/' <<<"$changed"; then
            echo "No extension changes, nothing to log."
            exit 0
          fi
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This PR changes the extension but not CHANGELOG.md. Add a bullet under ## Unreleased for each change users would notice (roam.pub/updates shows it), or label the PR no-changelog if there's none."
          exit 1

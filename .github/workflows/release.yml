name: Release

# Push a tag like v0.1.0 on a commit in main to publish a GitHub Release with the matching CHANGELOG.md notes,
# and open the "Roam Publish v0.1.0" pull request to Roam-Research/roam-depot that pins that commit as its
# source_commit. Moving the tag to another commit (delete it, push it again) re-pins that pull request, still as one
# commit, while it's open. Opening that PR needs the ROAM_DEPOT_TOKEN secret: a classic token of EJ's with
# `public_repo`, which can push to ejqs/roam-depot and open pull requests on Roam-Research/roam-depot. Without it, that
# job only says so.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./package.json').version")" \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ./build.sh
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            /^## / { on = 0 }
            on
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A moved tag (deleted and pushed again on a new commit) runs this again. Deleting the tag turns its Release
        # into a draft, so it's published again with fresh notes.
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

  roam-depot:
    needs: release
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.ROAM_DEPOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        # Roam Depot builds whatever commit it's pinned to; only main's are released.
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main, so it isn't sent to Roam Depot."; exit 1; }
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Updates Roam Publish to $version: \`source_commit\` is $GITHUB_SHA, tagged $GITHUB_REF_NAME on ejqs/roam-publish main."
            echo
            echo "Release notes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
            echo
            awk -v v="$version" '
              $0 ~ "^## " v "( |$)" { on = 1; next }
              /^## / { on = 0 }
              on
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/body.md"
      - name: Open the Roam Depot pull request
        env:
          GH_TOKEN: ${{ secrets.ROAM_DEPOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::No ROAM_DEPOT_TOKEN secret, so no Roam Depot pull request. Pin $GITHUB_SHA in Roam-Research/roam-depot by hand."
            exit 0
          fi
          branch="roam-publish-$GITHUB_REF_NAME"
          # Always one commit on Roam Depot's current main that changes only source_commit. A moved tag rebuilds it
          # and force-pushes it over the open pull request's branch, so that pull request still has just one commit.
          git clone https://github.com/Roam-Research/roam-depot.git "$RUNNER_TEMP/depot"
          cd "$RUNNER_TEMP/depot"
          file=extensions/ejqs/roam-publish.json
          sed -i -E "s/(\"source_commit\": *\")[0-9a-f]{40}\"/\1$GITHUB_SHA\"/" "$file"
          grep -q "\"source_commit\": *\"$GITHUB_SHA\"" "$file" || { echo "::error::Couldn't set source_commit in $file"; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Roam Publish $GITHUB_REF_NAME"
          git push --force "https://x-access-token:$TOKEN@github.com/ejqs/roam-depot.git" "HEAD:refs/heads/$branch"
          open=$(gh pr list --repo Roam-Research/roam-depot --head "$branch" --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            gh pr edit "$open" --repo Roam-Research/roam-depot --body-file "$RUNNER_TEMP/body.md"
            echo "Updated Roam-Research/roam-depot#$open to $GITHUB_SHA."
          else
            gh pr create --repo Roam-Research/roam-depot --base main --head "ejqs:$branch" \
              --title "Roam Publish $GITHUB_REF_NAME" --body-file "$RUNNER_TEMP/body.md"
          fi
